<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Cumprida | Lorena Godoi</title>
    
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS e Favicon -->
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg">

    <style>
        /* Reset para garantir que a página ocupe a tela toda sem rolar */
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: #0b0907;
            overflow: hidden; /* Remove o scroll */
            display: flex;
            flex-direction: column;
        }

        /* Faz o conteúdo principal ocupar o espaço entre header e footer e centralizar */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-content {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .success-icon img {
            width: 120px;
            height: auto;
            filter: sepia(1) saturate(5) hue-rotate(10deg);
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold, #e2c275);
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        h2 {
            font-family: 'Lora', serif;
            color: #f5f5f5;
            font-size: 1.1rem;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Ajuste do botão para não quebrar o layout */
        .btn-primary {
            display: inline-block;
            text-decoration: none;
            padding: 12px 25px;
            border: 1px solid var(--gold, #e2c275);
            color: var(--gold, #e2c275);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: var(--gold, #e2c275);
            color: #0b0907;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            h2 { font-size: 1rem; }
            .success-icon img { width: 100px; }
            footer { font-size: 0.8rem; }
        }
    </style>
</head>

<body class="success-page">

    <header>
        <div class="menu-content" style="justify-content: center;">
            <a href="index.html" id="titulo" style="font-family: 'Cinzel', serif; color: var(--gold); text-decoration: none; font-size: 1.5rem;">Lou.<span>Dev</span></a>
        </div>
    </header>

    <main>
        <section class="success-container">
            <article class="success-content">
                <figure class="success-icon">
                    <img src="./assets/img/success.svg" alt="Corvo Mensageiro" class="float-animation"> 
                </figure>

                <h1 data-pt="O Corvo Levantou Voo!" data-en="The Raven Has Taken Flight!">
                    O Corvo Levantou Voo!
                </h1>
                
                <h2 data-pt="Sua mensagem foi entregue à cidadela. <br> Logo mais retornarei com uma resposta à altura." 
                    data-en="Your message has reached the citadel. <br> I shall return with an answer soon.">
                    Sua mensagem foi entregue à cidadela. <br> Logo mais retornarei com uma resposta à altura.
                </h2>

                <a class="btn-primary" href="index.html" data-pt="Voltar para o Reino" data-en="Back to the Kingdom">
                    Voltar para o Reino
                </a>
            </article>
        </section>
    </main>

    <footer>
        <div class="footer-content" style="padding: 10px 0;">
            <p data-pt="&copy; 2026 Lorena Godoi. Todos os direitos reservados no Reino." 
               data-en="&copy; 2026 Lorena Godoi. All rights reserved in the Realm.">
                &copy; 2026 Lorena Godoi. Todos os direitos reservados no Reino.
            </p>
        </div>
    </footer>

    <script>
        const idiomaSalvo = localStorage.getItem('idioma_reino') || 'pt';

        if (idiomaSalvo === 'en') {
            document.title = "Mission Accomplished | Lorena Godoi";
            document.querySelectorAll('[data-en]').forEach(el => {
                el.innerHTML = el.getAttribute('data-en');
            });
        } else {
            document.title = "Missão Cumprida | Lorena Godoi";
            document.querySelectorAll('[data-pt]').forEach(el => {
                el.innerHTML = el.getAttribute('data-pt');
            });
        }
    </script>
</body>
</html>
