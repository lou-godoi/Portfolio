<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="success-page">

    <header>
        <div class="menu-content">
            <a href="index.html" id="titulo">Portfólio</a>
        </div>
    </header>

    <main>
        <section class="success-container">
            <article class="success-content" style="text-align: center; padding: 100px 20px;">

                <figure class="success-icon">
                    <img src="./assets/img/success.svg" 
                         alt="Corvo Mensageiro" 
                         class="float-animation"
                         width="150"
                         style="filter: sepia(1) saturate(5) hue-rotate(10deg);"> 
                </figure>

                <h1 style="color: var(--gold); margin-top: 20px;" 
                    data-pt="O Corvo Levantou Voo!" 
                    data-en="The Raven Has Taken Flight!">
                    O Corvo Levantou Voo!
                </h1>
                
                <!-- Adicionado o <br> no data-en para manter a formatação igual -->
                <h2 style="margin-bottom: 40px; font-weight: 300;" 
                    data-pt="Sua mensagem foi entregue à cidadela. <br> Logo mais retornarei com uma resposta à altura." 
                    data-en="Your message has reached the citadel. <br> I shall return with an answer soon.">
                    Sua mensagem foi entregue à cidadela. <br> Logo mais retornarei com uma resposta à altura.
                </h2>

                <a class="btn-primary" href="index.html" 
                   style="text-decoration: none; padding: 15px 30px; border: 1px solid var(--gold); color: var(--gold);"
                   data-pt="Voltar para o Reino" 
                   data-en="Back to the Kingdom">
                   Voltar para o Reino
                </a>

            </article>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <div class="logo">Lou.<span>Dev</span></div>
            <div class="social-links">

    <!-- GitHub -->

    <!-- LinkedIn -->
    <a href="https://linkedin.com/in/lorena-godoi-almeida" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-linkedin"></i>
    </a>
     <a href="https://behance.net/lougodoi" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-behance"></i>
    </a>

</div>
        </div>
        <p data-pt="&copy; 2026 Lorena Godoi. Todos os direitos reservados no Reino." 
           data-en="&copy; 2026 Lorena Godoi. All rights reserved in the Realm.">
           &copy; 2026 Lorena Godoi. Todos os direitos reservados no Reino.
        </p>
    </footer>

<script>
    // Executa direto, sem esperar o DOMContentLoaded, pois já está no fim do body
    const idiomaSalvo = localStorage.getItem('idioma_reino');

    if (idiomaSalvo === 'en') {
        document.title = "Mission Accomplished | Lorena Godoi";
        document.querySelectorAll('[data-en]').forEach(el => {
            el.innerHTML = el.getAttribute('data-en');
        });
    } else {
        // Garante o fallback para PT
        document.title = "Missão Cumprida | Lorena Godoi";
        document.querySelectorAll('[data-pt]').forEach(el => {
            el.innerHTML = el.getAttribute('data-pt');
        });
    }
</script>

</body>
</html>
